<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2350"/>
      <stop offset="1" stop-color="#060814"/>
    </linearGradient>
    <radialGradient id="sweep" cx="512" cy="512" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EE6FF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#5EE6FF" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
