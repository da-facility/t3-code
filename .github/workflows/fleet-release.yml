name: Fleet release

# Builds the fork's self-contained `t3` CLI archives and publishes them to this
# repository's GitHub releases, laid out the way T3CODE_RELEASE_BASE_URL expects:
#   <base>/v<version>/SHA256SUMS
#   <base>/v<version>/t3-<version>-<os>-<arch>.tar.gz
# Push a tag like v0.1.3-fleet.1, or run it by hand with a version.
# Linux archives publish the release; the macOS archive attaches itself when
# its runner finishes, so a slow macOS queue never holds back Linux hosts.

on:
  push:
    tags: ["v*-fleet.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.1.3-fleet.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then version="$INPUT_VERSION"; else version="${GITHUB_REF_NAME#v}"; fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Build ${{ matrix.key }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            runner: ubuntu-24.04
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - key: linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/fleet-build-cli
        with:
          version: ${{ needs.version.outputs.version }}
          key: ${{ matrix.key }}
          platform: linux
          arch: ${{ matrix.arch }}
          rust_target: ${{ matrix.rust_target }}
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.key }}
          path: release-cli/*
          if-no-files-found: error

  release:
    needs: [version, linux]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-cli
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          cd release-cli
          ls t3-*.tar.gz >/dev/null
          tag="v$VERSION"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D existing || true
            gh release upload "$tag" t3-*.tar.gz --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" t3-*.tar.gz -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "t3 $VERSION (fleet)" --prerelease \
              --notes "Fleet build of t3 $VERSION. Install with scripts/fleet/install."
          fi
          { cat existing/SHA256SUMS 2>/dev/null || true; sha256sum t3-*.tar.gz; } |
            awk '{ sums[$2] = $1 } END { for (f in sums) print sums[f] "  " f }' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$tag" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"

  darwin:
    name: Build darwin-arm64
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/fleet-build-cli
        with:
          version: ${{ needs.version.outputs.version }}
          key: darwin-arm64
          platform: mac
          arch: arm64
          rust_target: aarch64-apple-darwin
      - name: Attach to the release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          for _ in $(seq 1 60); do gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 30; done
          cd release-cli
          gh release upload "$tag" t3-*.tar.gz --clobber -R "$GITHUB_REPOSITORY"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D existing || true
          { cat existing/SHA256SUMS 2>/dev/null || true; shasum -a 256 t3-*.tar.gz; } |
            awk '{ sums[$2] = $1 } END { for (f in sums) print sums[f] "  " f }' | sort -k2 > SHA256SUMS
          gh release upload "$tag" SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
