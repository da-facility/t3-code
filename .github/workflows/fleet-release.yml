name: Fleet release

# Builds the fork's self-contained `t3` CLI archives and publishes them to this
# repository's GitHub releases, laid out the way T3CODE_RELEASE_BASE_URL expects:
#   <base>/v<version>/SHA256SUMS
#   <base>/v<version>/t3-<version>-<os>-<arch>.tar.gz
# Push a tag like v0.1.3-fleet.1, or run it by hand with a version.

on:
  push:
    tags: ["v*-fleet.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.1.3-fleet.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fleet-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then version="$INPUT_VERSION"; else version="${GITHUB_REF_NAME#v}"; fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.key }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - key: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
          - key: darwin-arm64
            runner: macos-15
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
    env:
      VERSION: ${{ needs.version.outputs.version }}
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Build server and web client
        run: vp run --filter t3 build

      - name: Apply web client branding
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build CLI single-executable
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Stage resource monitor
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/cli-resource-monitor/${{ matrix.key }}"
          mkdir -p "$dir"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" "$dir/"

      - name: Build CLI archive
        run: >-
          node scripts/build-cli-archive.ts
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --version "$VERSION"
          --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor"
          --output-dir release-cli

      - name: Smoke-test CLI archive
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.key }}
          path: release-cli/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-cli

      - name: Checksums
        working-directory: release-cli
        run: sha256sum t3-*.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-cli/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release-cli/* -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "t3 $VERSION (fleet)" --prerelease \
              --notes "Fleet build of t3 $VERSION. Install with scripts/fleet/install."
          fi
